<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />

  <!-- Inner Dark Terminal Surface -->
  <rect x="4" y="4" width="56" height="56" rx="13" fill="#09090f" fill-opacity="0.9" stroke="url(#glow)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Window Header dots -->
  <circle cx="14" cy="14" r="2.5" fill="#ef4444" opacity="0.8" />
  <circle cx="21" cy="14" r="2.5" fill="#eab308" opacity="0.8" />
  <circle cx="28" cy="14" r="2.5" fill="#22c55e" opacity="0.8" />

  <!-- Terminal Prompt > -->
  <path d="M16 28 L28 37 L16 46" stroke="url(#glow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cursor / Underscore _ -->
  <line x1="33" y1="46" x2="48" y2="46" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
</svg>
